<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">The Villa system architecture — Render deployment</title>
  <desc id="description">Render-hosted single Docker web service with React frontend and FastAPI backend, connected to Supabase, PayMongo, email and SMS providers, Google Identity, map services and optional Gemini recommendations.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324a; }
      .title { font-size: 25px; font-weight: 700; letter-spacing: .5px; }
      .subtitle { font-size: 12px; fill: #526579; }
      .layer { font-size: 19px; font-weight: 700; }
      .layer-sub { font-size: 12px; font-weight: 600; fill: #46596c; }
      .role { font-size: 15px; font-weight: 700; fill: #fff; }
      .role-sub { font-size: 11px; fill: #edf4fa; }
      .card-title { font-size: 13px; font-weight: 700; }
      .copy { font-size: 11px; fill: #35495e; }
      .small { font-size: 10px; fill: #526579; }
      .stack { font-size: 12px; font-weight: 700; fill: #fff; }
      .card { fill: #fff; stroke: #cbd9e6; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .both { fill: none; stroke: #334155; stroke-width: 1.8; marker-start: url(#arrowStart); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#fff"/>
  <text x="800" y="34" text-anchor="middle" class="title">THE VILLA · SYSTEM ARCHITECTURE</text>
  <text x="800" y="54" text-anchor="middle" class="subtitle">Render deployment · repository-based application view · external integrations depend on provider configuration</text>

  <g>
    <rect x="22" y="70" width="500" height="62" rx="12" fill="#124b91"/>
    <circle cx="60" cy="101" r="20" fill="#fff"/>
    <circle cx="60" cy="95" r="6" fill="#124b91"/>
    <path d="M47 114c1-8 6-12 13-12s12 4 13 12" fill="#124b91"/>
    <text x="92" y="96" class="role" fill="#fff">ADMINISTRATOR / FRONT DESK</text>
    <text x="92" y="115" class="role-sub" fill="#edf4fa">Bookings, payments and front-desk operations</text>

    <rect x="550" y="70" width="500" height="62" rx="12" fill="#198b43"/>
    <circle cx="588" cy="101" r="20" fill="#fff"/>
    <circle cx="588" cy="95" r="6" fill="#198b43"/>
    <path d="M575 114c1-8 6-12 13-12s12 4 13 12" fill="#198b43"/>
    <text x="620" y="96" class="role" fill="#fff">GUEST / CUSTOMER</text>
    <text x="620" y="115" class="role-sub" fill="#edf4fa">Browse villas, book stays and share feedback</text>

    <rect x="1078" y="70" width="500" height="62" rx="12" fill="#e87500"/>
    <circle cx="1116" cy="101" r="20" fill="#fff"/>
    <circle cx="1116" cy="95" r="6" fill="#e87500"/>
    <path d="M1103 114c1-8 6-12 13-12s12 4 13 12" fill="#e87500"/>
    <text x="1148" y="96" class="role" fill="#fff">STAFF / MAINTENANCE</text>
    <text x="1148" y="115" class="role-sub" fill="#edf4fa">Assigned work, schedules and task updates</text>
  </g>
  <path d="M272 132v18" class="arrow"/>
  <path d="M800 132v18" class="arrow"/>
  <path d="M1328 132v18" class="arrow"/>

  <rect x="20" y="151" width="1560" height="263" rx="16" fill="#f3f8ff" stroke="#4b9cff" stroke-width="2"/>
  <rect x="480" y="138" width="640" height="28" rx="14" fill="#1555a5"/>
  <text x="800" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">RENDER · ONE DOCKER WEB SERVICE · SAME-ORIGIN HTTPS</text>
  <text x="800" y="184" text-anchor="middle" class="small">Docker builds the Vite app and packages its static files with FastAPI; the app runs one Uvicorn worker.</text>

  <rect x="34" y="196" width="1532" height="168" rx="12" fill="#effbf1" stroke="#36b864" stroke-width="1.8"/>
  <text x="800" y="220" text-anchor="middle" class="layer" fill="#13753a">FRONTEND / PRESENTATION LAYER</text>
  <text x="800" y="238" text-anchor="middle" class="layer-sub">Responsive React application · served by FastAPI from the Render service</text>
  <g>
    <rect x="48" y="250" width="288" height="94" rx="9" class="card"/>
    <text x="192" y="275" text-anchor="middle" class="card-title" fill="#124b91">PUBLIC LANDING &amp; VILLAS</text>
    <text x="64" y="299" class="copy">• Villa catalog, galleries and details</text>
    <text x="64" y="318" class="copy">• Policies, maps and guest reviews</text>
    <text x="64" y="337" class="copy">• Booking form and feedback</text>

    <rect x="350" y="250" width="288" height="94" rx="9" class="card"/>
    <text x="494" y="275" text-anchor="middle" class="card-title" fill="#124b91">BOOKING &amp; CUSTOMER</text>
    <text x="366" y="299" class="copy">• Availability and reservations</text>
    <text x="366" y="318" class="copy">• Checkout and payment status</text>
    <text x="366" y="337" class="copy">• Customer account and profile</text>

    <rect x="652" y="250" width="288" height="94" rx="9" class="card"/>
    <text x="796" y="275" text-anchor="middle" class="card-title" fill="#124b91">ADMIN &amp; FRONT DESK</text>
    <text x="668" y="299" class="copy">• Reservations, payments and villas</text>
    <text x="668" y="318" class="copy">• Walk-ins and stay lifecycle</text>
    <text x="668" y="337" class="copy">• Staff, reports and feedback</text>

    <rect x="954" y="250" width="288" height="94" rx="9" class="card"/>
    <text x="1098" y="275" text-anchor="middle" class="card-title" fill="#124b91">STAFF &amp; MAINTENANCE</text>
    <text x="970" y="299" class="copy">• Tasks, assignments and schedules</text>
    <text x="970" y="318" class="copy">• Checklists, messages and alerts</text>
    <text x="970" y="337" class="copy">• Work-hours records and profile</text>

    <rect x="1256" y="250" width="296" height="94" rx="9" class="card"/>
    <text x="1404" y="275" text-anchor="middle" class="card-title" fill="#124b91">CLIENT BEHAVIOR</text>
    <text x="1272" y="299" class="copy">• Role-protected portal routes</text>
    <text x="1272" y="318" class="copy">• API requests and form validation</text>
    <text x="1272" y="337" class="copy">• SSE invalidations then data re-fetch</text>
  </g>
  <rect x="48" y="353" width="1504" height="20" rx="10" fill="#087532"/>
  <text x="800" y="367" text-anchor="middle" class="stack" fill="#fff">React 19 · Vite · React Router · Bootstrap 5 · CSS · Recharts · Leaflet</text>

  <path d="M800 414v27" class="both"/>
  <rect x="590" y="427" width="420" height="25" rx="12" fill="#1555a5"/>
  <text x="800" y="444" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">HTTPS · JSON REST API · PUBLIC / ROLE-AUTHENTICATED SSE</text>

  <rect x="20" y="458" width="1560" height="262" rx="16" fill="#eef6ff" stroke="#4b9cff" stroke-width="2"/>
  <text x="800" y="486" text-anchor="middle" class="layer" fill="#1555a5">BACKEND / BUSINESS LOGIC LAYER</text>
  <text x="800" y="505" text-anchor="middle" class="layer-sub">FastAPI · protected role-based routes · webhook handlers · in-process background workers</text>
  <g>
    <rect x="34" y="518" width="244" height="146" rx="10" class="card"/>
    <text x="156" y="544" text-anchor="middle" class="card-title" fill="#1555a5">1 · AUTH &amp; PROFILES</text>
    <text x="50" y="570" class="copy">• Customer login and sessions</text>
    <text x="50" y="591" class="copy">• Role checks for staff portals</text>
    <text x="50" y="612" class="copy">• Profile and account lifecycle</text>
    <text x="50" y="642" class="small">Google / phone options as configured</text>

    <rect x="290" y="518" width="244" height="146" rx="10" class="card"/>
    <text x="412" y="544" text-anchor="middle" class="card-title" fill="#1555a5">2 · VILLAS &amp; BOOKINGS</text>
    <text x="306" y="570" class="copy">• Catalog and availability</text>
    <text x="306" y="591" class="copy">• Guest and manual reservations</text>
    <text x="306" y="612" class="copy">• Cancellation and checkout</text>
    <text x="306" y="642" class="small">Booking preparation assignments</text>

    <rect x="546" y="518" width="244" height="146" rx="10" class="card"/>
    <text x="668" y="544" text-anchor="middle" class="card-title" fill="#1555a5">3 · PAYMENTS &amp; STAY</text>
    <text x="562" y="570" class="copy">• PayMongo checkout / intents</text>
    <text x="562" y="591" class="copy">• Signed payment webhooks</text>
    <text x="562" y="612" class="copy">• Front-desk settlement</text>
    <text x="562" y="642" class="small">Reconciliation and check-in / out</text>

    <rect x="802" y="518" width="244" height="146" rx="10" class="card"/>
    <text x="924" y="544" text-anchor="middle" class="card-title" fill="#1555a5">4 · ADMIN &amp; STAFF OPS</text>
    <text x="818" y="570" class="copy">• Staff accounts and work hours</text>
    <text x="818" y="591" class="copy">• Tasks and maintenance workflow</text>
    <text x="818" y="612" class="copy">• Messages and notifications</text>
    <text x="818" y="642" class="small">Schedules, evidence and approvals</text>

    <rect x="1058" y="518" width="244" height="146" rx="10" class="card"/>
    <text x="1180" y="544" text-anchor="middle" class="card-title" fill="#1555a5">5 · DELIVERY WORKERS</text>
    <text x="1074" y="570" class="copy">• Booking / staff assignment</text>
    <text x="1074" y="591" class="copy">• Payment reconciliation</text>
    <text x="1074" y="612" class="copy">• Maintenance on-call</text>
    <text x="1074" y="642" class="small">Email, invitation and cleanup jobs</text>

    <rect x="1314" y="518" width="252" height="146" rx="10" class="card"/>
    <text x="1440" y="544" text-anchor="middle" class="card-title" fill="#1555a5">6 · FEEDBACK REVIEW</text>
    <text x="1330" y="570" class="copy">• Local pilot Naive Bayes analysis</text>
    <text x="1330" y="591" class="copy">• Complaint and rating reports</text>
    <text x="1330" y="612" class="copy">• Optional Gemini draft suggestions</text>
    <text x="1330" y="642" class="small">Administrator review required</text>
  </g>
  <rect x="34" y="679" width="1532" height="25" rx="12" fill="#1555a5"/>
  <text x="800" y="696" text-anchor="middle" class="stack" fill="#fff">Python · FastAPI · Pydantic · Supabase Python Client · Uvicorn (1 worker) · background workers · signed webhooks</text>

  <path d="M420 720v34" class="both"/>
  <path d="M1180 720v34" class="both"/>

  <rect x="20" y="758" width="780" height="208" rx="16" fill="#faf5ff" stroke="#bd83ff" stroke-width="2"/>
  <text x="410" y="786" text-anchor="middle" class="layer" fill="#6b21a8">SUPABASE DATA PLATFORM</text>
  <g>
    <rect x="36" y="802" width="174" height="127" rx="9" class="card"/>
    <text x="123" y="828" text-anchor="middle" class="card-title" fill="#6b21a8">SUPABASE AUTH</text>
    <text x="50" y="854" class="copy">Guest identity and</text>
    <text x="50" y="873" class="copy">authentication sessions</text>
    <text x="50" y="901" class="small">Portal tokens validated server-side</text>

    <rect x="222" y="802" width="174" height="127" rx="9" class="card"/>
    <text x="309" y="828" text-anchor="middle" class="card-title" fill="#6b21a8">POSTGRESQL</text>
    <text x="236" y="854" class="copy">Bookings, payments,</text>
    <text x="236" y="873" class="copy">tasks and staff records</text>
    <text x="236" y="901" class="small">Feedback, profiles and settings</text>

    <rect x="408" y="802" width="174" height="127" rx="9" class="card"/>
    <text x="495" y="828" text-anchor="middle" class="card-title" fill="#6b21a8">SUPABASE STORAGE</text>
    <text x="422" y="854" class="copy">Profile photos in the</text>
    <text x="422" y="873" class="copy">profile-photos bucket</text>
    <text x="422" y="901" class="small">Used for uploaded profile images</text>

    <rect x="594" y="802" width="190" height="127" rx="9" class="card"/>
    <text x="689" y="828" text-anchor="middle" class="card-title" fill="#6b21a8">SUPABASE REALTIME</text>
    <text x="608" y="854" class="copy">Server-side Postgres</text>
    <text x="608" y="873" class="copy">change subscription</text>
    <text x="608" y="901" class="small">Signals backend LiveHub / SSE</text>
  </g>
  <text x="410" y="951" text-anchor="middle" class="small">SSE sends role-scoped change domains, not database rows; browser re-fetches through authorized APIs.</text>

  <rect x="820" y="758" width="760" height="208" rx="16" fill="#fff8ef" stroke="#ffb24d" stroke-width="2"/>
  <text x="1200" y="786" text-anchor="middle" class="layer" fill="#d35400">EXTERNAL INTEGRATION LAYER</text>
  <g>
    <rect x="836" y="802" width="174" height="127" rx="9" class="card"/>
    <text x="923" y="828" text-anchor="middle" class="card-title" fill="#d35400">PAYMONGO</text>
    <text x="850" y="854" class="copy">Checkout / payment API</text>
    <text x="850" y="873" class="copy">Signed webhook callbacks</text>
    <text x="850" y="901" class="small">When payment integration is enabled</text>

    <rect x="1022" y="802" width="174" height="127" rx="9" class="card"/>
    <text x="1109" y="828" text-anchor="middle" class="card-title" fill="#d35400">EMAIL</text>
    <text x="1036" y="854" class="copy">Resend HTTPS and/or SMTP</text>
    <text x="1036" y="873" class="copy">Confirmations and notices</text>
    <text x="1036" y="901" class="small">Flow support varies by message</text>

    <rect x="1208" y="802" width="174" height="127" rx="9" class="card"/>
    <text x="1295" y="828" text-anchor="middle" class="card-title" fill="#d35400">SMS DELIVERY</text>
    <text x="1222" y="854" class="copy">Supabase signed SMS hook</text>
    <text x="1222" y="873" class="copy">Backend → HTTPSMS gateway</text>
    <text x="1222" y="901" class="small">Requires provider configuration</text>

    <rect x="1394" y="802" width="170" height="127" rx="9" class="card"/>
    <text x="1479" y="828" text-anchor="middle" class="card-title" fill="#d35400">PUBLIC SERVICES</text>
    <text x="1408" y="854" class="copy">Google Identity credential</text>
    <text x="1408" y="873" class="copy">OSM map tiles · OSRM routes</text>
    <text x="1408" y="901" class="small">Gemini drafts are optional</text>
  </g>
  <text x="1200" y="951" text-anchor="middle" class="small">Browser loads Google Identity / map services; server calls payment, email, SMS and optional Gemini APIs.</text>

  <path d="M800 966v25" class="both"/>
  <rect x="176" y="992" width="1248" height="100" rx="14" fill="#eef6ff" stroke="#4b9cff" stroke-width="1.8"/>
  <text x="800" y="1018" text-anchor="middle" class="layer" fill="#1555a5">ACCESS LAYER · DEVICES &amp; PLATFORM</text>
  <rect x="202" y="1030" width="582" height="48" rx="9" class="card"/>
  <text x="493" y="1050" text-anchor="middle" class="card-title" fill="#1555a5">WEB BROWSER · DESKTOP</text>
  <text x="493" y="1067" text-anchor="middle" class="copy">Guest booking · Admin · Front Desk · Staff / Maintenance portals</text>
  <rect x="816" y="1030" width="582" height="48" rx="9" class="card"/>
  <text x="1107" y="1050" text-anchor="middle" class="card-title" fill="#1555a5">MOBILE BROWSER · PHONE / TABLET</text>
  <text x="1107" y="1067" text-anchor="middle" class="copy">Responsive guest and role-protected operations interfaces</text>

  <text x="800" y="1110" text-anchor="middle" class="small">Render hosts the web app and API; Supabase and configured providers remain separate services. Keep server secrets out of the browser and repository.</text>
</svg>
