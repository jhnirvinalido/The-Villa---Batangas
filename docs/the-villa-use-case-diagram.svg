<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title description">
  <title id="title">The Villa use-case diagram</title>
  <desc id="description">UML-style use-case diagram for The Villa with Guest, Administrator, Front Desk, Staff and Maintenance actors and the PayMongo payment provider. Use cases reflect current public and role-protected portals.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #24364a; }
      .title { font-size: 26px; font-weight: 700; letter-spacing: .4px; }
      .subtitle { font-size: 12px; fill: #627184; }
      .boundary-title { font-size: 17px; font-weight: 700; fill: #fff; }
      .group-title { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
      .actor-label { font-size: 12px; font-weight: 700; }
      .actor-note { font-size: 10px; fill: #637083; }
      .usecase { fill: #fff; stroke: #8da3b8; stroke-width: 1.5; }
      .case-label { font-size: 11px; font-weight: 600; }
      .association { fill: none; stroke: #74879b; stroke-width: 1.25; opacity: .7; }
      .actor-line { fill: none; stroke: #35485d; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="1220" fill="#f7f9fc"/>
  <text x="800" y="38" text-anchor="middle" class="title">THE VILLA · USE-CASE DIAGRAM</text>
  <text x="800" y="59" text-anchor="middle" class="subtitle">User goals supported by the current public, Admin, Front Desk, Staff and Maintenance portals</text>

  <rect x="270" y="92" width="1050" height="1080" rx="18" fill="#fff" stroke="#1c5794" stroke-width="2"/>
  <path d="M288 92h1014a18 18 0 0 1 18 18v38H270v-38a18 18 0 0 1 18-18z" fill="#1555a5"/>
  <text x="795" y="123" text-anchor="middle" class="boundary-title" fill="#fff">THE VILLA WEB SYSTEM</text>

  <rect x="286" y="156" width="1018" height="184" rx="10" fill="#f0faf2"/>
  <rect x="286" y="348" width="1018" height="184" rx="10" fill="#f1f6fc"/>
  <rect x="286" y="540" width="1018" height="184" rx="10" fill="#f2f7fd"/>
  <rect x="286" y="732" width="1018" height="184" rx="10" fill="#fff8ed"/>
  <rect x="286" y="924" width="1018" height="232" rx="10" fill="#fff5ec"/>

  <text x="306" y="177" class="group-title" fill="#287341">GUEST</text>
  <text x="306" y="369" class="group-title" fill="#315c88">ADMINISTRATOR</text>
  <text x="306" y="561" class="group-title" fill="#315c88">FRONT DESK</text>
  <text x="306" y="753" class="group-title" fill="#94601d">STAFF</text>
  <text x="306" y="945" class="group-title" fill="#a45b25">MAINTENANCE</text>

  <g class="association">
    <path d="M184 252L330 220M184 252L665 220M184 252L1000 220"/>
    <path d="M184 252L330 294M184 252L665 294M184 252L1000 294"/>
    <path d="M184 444L330 412M184 444L665 412M184 444L1000 412"/>
    <path d="M184 444L307.5 486M184 444L567.5 486M184 444L827.5 486M184 444L1087.5 486"/>
    <path d="M184 636L330 604M184 636L665 604M184 636L1000 604"/>
    <path d="M184 636L330 678M184 636L665 678M184 636L1000 678"/>
    <path d="M184 828L330 796M184 828L665 796M184 828L1000 796"/>
    <path d="M184 828L330 870M184 828L665 870M184 828L1000 870"/>
    <path d="M184 1040L330 1008M184 1040L665 1008"/>
    <path d="M184 1040L330 1090M184 1040L665 1090"/>
    <path d="M1270 294H1390"/>
  </g>

