    <ellipse cx="465" cy="220" rx="135" ry="27" class="usecase"/>
    <text x="465" y="224" text-anchor="middle" class="case-label">Browse villas and guest information</text>
    <ellipse cx="800" cy="220" rx="135" ry="27" class="usecase"/>
